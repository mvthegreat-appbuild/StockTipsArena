name: Scrape StockTipsArena Swing
on:
schedule:
- cron: '*/30 3-11 * * 1-5'
workflow_dispatch:
permissions:
contents: write
jobs:
scrape:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: '3.11'
- name: Install Playwright
run: |
python -m pip install --upgrade pip
pip install playwright
playwright install chromium
- name: Run Scraper
run: |
if [ -f fetch_stocktipsarena.py ]; then
python fetch_stocktipsarena.py
else
echo "fetch_stocktipsarena.py not found; skipping."
fi
- name: Commit JSON
run: |
git config user.name "github-actions[bot]"
git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
if [ -f stocktipsarena_swing.json ]; then
git add stocktipsarena_swing.json
git diff --staged --quiet || git commit -m "Update StockTipsArena Swing Picks"
git push
fi
