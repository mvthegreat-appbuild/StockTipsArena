
<style>
.broker-tabs {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px 0 14px;
  margin-bottom:8px;
  white-space:nowrap;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.broker-tabs .fbtn {
  flex:0 0 auto;
  min-width:max-content;
  padding:10px 14px;
}
.broker-tabs .fbtn.on {
  background:#124c3a;
  border-color:#35dda2;
  color:#65e8b4;
}
</style>

<script>
(function () {
  const tabs = document.getElementById("brokerTabs");
  if (!tabs || typeof render !== "function") return;

  const originalRender = render;
  let selectedBroker = "all";

  const aliases = {
    "Motilal Oswal": ["motilal oswal", "motilal"],
    "ICICI Securities": ["icici securities", "icici sec"],
    "HDFC Securities": ["hdfc securities", "hdfc sec"],
    "Axis Securities": ["axis securities", "axis sec"],
    "Kotak Securities": ["kotak securities", "kotak"],
    "Sharekhan": ["sharekhan"],
    "Nuvama": ["nuvama"],
    "JM Financial": ["jm financial"],
    "Anand Rathi": ["anand rathi"],
    "Prabhudas Lilladher": ["prabhudas lilladher", "prabhudas"],
    "SBI Securities": ["sbi securities", "sbi sec"],
    "Geojit": ["geojit"]
  };

  function matchesBroker(trade, broker) {
    if (broker === "all") return true;

    const text = [
      trade.advisor,
      trade.source,
      trade.broker,
      trade.firm,
      trade.name
    ].join(" ").toLowerCase();

    return aliases[broker].some(alias =>
      text.includes(alias)
    );
  }

  function updateCounts() {
    const all = trades || [];

    tabs.querySelectorAll("[data-broker]").forEach(button => {
      const broker = button.dataset.broker;
      const count = all.filter(t =>
        matchesBroker(t, broker)
      ).length;

      if (!button.dataset.originalLabel) {
        button.dataset.originalLabel = button.textContent.trim();
      }

      button.textContent =
        button.dataset.originalLabel + " (" + count + ")";
    });
  }

  render = function () {
    const allTrades = trades;
    trades = allTrades.filter(t =>
      matchesBroker(t, selectedBroker)
    );

    try {
      originalRender();
    } finally {
      trades = allTrades;
    }

    updateCounts();
  };

  tabs.addEventListener("click", function (event) {
    const button = event.target.closest("[data-broker]");
    if (!button) return;

    selectedBroker = button.dataset.broker;

    tabs.querySelectorAll("[data-broker]").forEach(tab => {
      tab.classList.toggle("on", tab === button);
    });

    render();
  });

  updateCounts();
  render();
})();
</script>
